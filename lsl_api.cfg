[ports]
; This Windows host has working IPv4 but only link-local IPv6. Advertising
; IPv6 alongside IPv4 can leave locally resolved outlets without a usable
; endpoint address.
IPv6 = disable

[lab]
; Keep same-machine demo discovery independent of multicast and firewall
; behavior. LAN multicast remains enabled for real streams on other PCs.
KnownPeers = {127.0.0.1}
